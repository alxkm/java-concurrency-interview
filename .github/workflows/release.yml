name: release

# Push a tag such as v1.1.0 and this builds the jar, with the questions inside it, and attaches it to
# a GitHub release. The JBang catalog points at the latest release's jar, so a tag is all it takes
# for `jbang quiz@alxkm/java-concurrency-interview` to serve the new questions.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Check the jar runs with no checkout next to it
        run: |
          cp build/libs/java-concurrency-interview.jar "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          echo q | java -jar java-concurrency-interview.jar --no-color

      # The notes are this version's section of CHANGELOG.md, from its "## 1.1.0" heading to the next.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
          gh release create "$GITHUB_REF_NAME" build/libs/java-concurrency-interview.jar \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
