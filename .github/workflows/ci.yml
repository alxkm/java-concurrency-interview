name: build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

# A new push to a pull request makes the run for the previous push pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and check the question content
        run: ./gradlew build --no-daemon

      # The quiz is meant to run without a build at all, so CI checks that path too rather than
      # trusting that it still compiles on its own.
      - name: Run the quiz the way a first-time reader would
        run: echo q | java src/main/java/org/alxkm/interview/Quiz.java --no-color

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report-java-${{ matrix.java }}
          path: build/reports/tests/test/
          retention-days: 14
