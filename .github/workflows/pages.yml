name: pages

# The web version, built by tools/site/build.mjs from questions/ with the quiz's own parser, so the site
# cannot disagree with the files. Pull requests build it too, so a broken build fails before merge;
# only master deploys.
on:
  push:
    branches: [ "master" ]
    paths: [ "questions/**", "site/**", "tools/site/**", "src/main/**", ".github/workflows/pages.yml" ]
  pull_request:
    paths: [ "questions/**", "site/**", "tools/site/**", "src/main/**", ".github/workflows/pages.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/site/package-lock.json

      - name: Build the site
        working-directory: tools/site
        run: |
          npm ci
          node build.mjs ../../_site

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
