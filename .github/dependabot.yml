version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, build]
    groups:
      junit:
        patterns: ["org.junit*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, build]

  # The site's build: markdown rendering and highlighting, run at build time only.
  - package-ecosystem: npm
    directory: /tools/site
    schedule:
      interval: weekly
    labels: [dependencies, build]
