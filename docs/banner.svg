<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Java Concurrency Interview</title>
  <desc id="desc">Two cartoon threads, each hugging its own lock and reaching for the other's: a deadlock.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0883e"/>
      <stop offset="1" stop-color="#f7c948"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cbd5e1"/>
    </marker>
    <g id="lock">
      <path d="M-16 -6 V-20 a16 16 0 0 1 32 0 V-6" fill="none" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
      <rect x="-26" y="-8" width="52" height="42" rx="9" fill="#facc15" stroke="#a16207" stroke-width="3"/>
      <circle cx="0" cy="9" r="5" fill="#713f12"/>
      <rect x="-2" y="11" width="4" height="12" rx="2" fill="#713f12"/>
    </g>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>

  <!-- thread timelines in the background -->
  <g stroke="#334155" stroke-width="2" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.7">
    <line x1="40" y1="60" x2="1240" y2="60"/>
    <line x1="40" y1="380" x2="1240" y2="380"/>
  </g>

  <!-- title -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="150" font-size="60" font-weight="800" fill="#f8fafc">Java Concurrency</text>
    <text x="72" y="222" font-size="60" font-weight="800" fill="url(#accent)">Interview</text>
    <text x="74" y="276" font-size="24" fill="#94a3b8">The questions you will actually be asked,</text>
    <text x="74" y="308" font-size="24" fill="#94a3b8">answered the way you would say them out loud.</text>

    <g font-size="17" font-weight="600">
      <rect x="72" y="334" width="160" height="34" rx="17" fill="#1e3a5f"/>
      <text x="152" y="357" text-anchor="middle" fill="#93c5fd">happens-before</text>
      <rect x="244" y="334" width="156" height="34" rx="17" fill="#3b2a1a"/>
      <text x="322" y="357" text-anchor="middle" fill="#fdba74">virtual threads</text>
      <rect x="412" y="334" width="118" height="34" rx="17" fill="#3a1d2e"/>
      <text x="471" y="357" text-anchor="middle" fill="#f9a8d4">deadlocks</text>
    </g>
  </g>

  <!-- "waits for" cycle above the two threads -->
  <g fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#head)">
    <path d="M845 120 C 900 52, 1020 52, 1082 112"/>
    <path d="M1108 338 C 1050 400, 920 400, 860 342"/>
  </g>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#cbd5e1" text-anchor="middle">
    <text x="964" y="58">wants L2</text>
    <text x="984" y="408">wants L1</text>
  </g>

  <!-- thread A, orange, hugging L1 and eyeing L2 -->
  <g transform="translate(850 228)">
    <ellipse cx="0" cy="88" rx="58" ry="10" fill="#020617" opacity="0.5"/>
    <path d="M-52 10 C -56 -58, 56 -58, 52 10 C 50 58, -50 58, -52 10 Z" fill="#f0883e"/>
    <circle cx="-16" cy="-12" r="13" fill="#fff"/>
    <circle cx="20" cy="-12" r="13" fill="#fff"/>
    <circle cx="-10" cy="-10" r="6" fill="#0f172a"/>
    <circle cx="26" cy="-10" r="6" fill="#0f172a"/>
    <path d="M-26 -32 L-6 -28" stroke="#7c2d12" stroke-width="4" stroke-linecap="round"/>
    <path d="M10 -28 L30 -32" stroke="#7c2d12" stroke-width="4" stroke-linecap="round"/>
    <path d="M-8 14 Q 4 6 16 14" fill="none" stroke="#7c2d12" stroke-width="4" stroke-linecap="round"/>
    <path d="M44 -40 q 6 10 0 16 q -6 -6 0 -16 z" fill="#7dd3fc"/>
    <!-- arms around its lock -->
    <path d="M-48 20 Q -70 58 -40 66" fill="none" stroke="#c2410c" stroke-width="9" stroke-linecap="round"/>
    <use href="#lock" transform="translate(-24 54) scale(0.8)"/>
    <text x="-24" y="116" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#fde68a" text-anchor="middle">L1</text>
    <text x="0" y="-62" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#fdba74" text-anchor="middle">thread A</text>
  </g>

  <!-- thread B, blue, hugging L2 and eyeing L1 -->
  <g transform="translate(1110 228)">
    <ellipse cx="0" cy="88" rx="58" ry="10" fill="#020617" opacity="0.5"/>
    <path d="M-52 10 C -56 -58, 56 -58, 52 10 C 50 58, -50 58, -52 10 Z" fill="#58a6ff"/>
    <circle cx="-20" cy="-12" r="13" fill="#fff"/>
    <circle cx="16" cy="-12" r="13" fill="#fff"/>
    <circle cx="-26" cy="-10" r="6" fill="#0f172a"/>
    <circle cx="10" cy="-10" r="6" fill="#0f172a"/>
    <path d="M-30 -32 L-10 -28" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
    <path d="M6 -28 L26 -32" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
    <path d="M-16 14 Q -4 6 8 14" fill="none" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
    <path d="M-44 -40 q 6 10 0 16 q -6 -6 0 -16 z" fill="#7dd3fc"/>
    <path d="M48 20 Q 70 58 40 66" fill="none" stroke="#1d4ed8" stroke-width="9" stroke-linecap="round"/>
    <use href="#lock" transform="translate(24 54) scale(0.8)"/>
    <text x="24" y="116" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#fde68a" text-anchor="middle">L2</text>
    <text x="0" y="-62" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#93c5fd" text-anchor="middle">thread B</text>
  </g>

  <!-- the punchline -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <rect x="922" y="200" width="116" height="52" rx="12" fill="#0b1220" stroke="#475569" stroke-width="2"/>
    <text x="980" y="222" font-size="14" fill="#94a3b8">BLOCKED since</text>
    <text x="980" y="243" font-size="17" font-weight="700" fill="#f87171">09:14:07</text>
  </g>
</svg>
